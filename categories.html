<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toutes les catégories - D-AB</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #0b2147;
    }

    header {
      background: #08234d;
      color: white;
      padding: 22px;
      text-align: center;
    }

    .retour {
      position: absolute;
      left: 20px;
      color: white;
      text-decoration: none;
      font-size: 30px;
    }

    main {
      padding: 25px 20px 100px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 25px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .category {
      background: white;
      border-radius: 18px;
      padding: 25px 10px;
      text-align: center;
      font-size: 18px;
      box-shadow: 0 5px 15px rgba(0,0,0,.06);
    }

    .icon {
      font-size: 42px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<header>
  <a class="retour" href="produits.html">←</a>
  <strong>D-<span style="color:#ffb800">AB</span></strong>
</header>

<main>
  <h1>Toutes les catégories</h1>

  <div class="categories">
    <div class="category">
      <div class="icon">🏗️</div>
      BTP
    </div>

    <div class="category">
      <div class="icon">⚡</div>
      Électricité
    </div>

    <div class="category">
      <div class="icon">🪚</div>
      Menuiserie
    </div>

    <div class="category">
      <div class="icon">🎨</div>
      Décoration
    </div>

    <div class="category">
      <div class="icon">🔧</div>
      Plomberie
    </div>
  </div>
</main>

</body>
</html>
