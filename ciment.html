 <!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciment 32,5R - D-AB</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #172033;
    }

    header {
      background: #172033;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #172033;
      text-decoration: none;
      font-weight: bold;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .product-image {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    h2 {
      margin-bottom: 12px;
    }

    .description {
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .seller {
      margin-bottom: 20px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-back {
      background: #172033;
      color: white;
    }

<header>

</header>

<main class="container">

    <img
      class="product-image"
      src="IMG_20260816_170619.jpg"
      alt="Ciment 32,5R"

    <h2>Ciment 32,5R</h2>

    <p class="description">
      Ciment de qualité pour vos travaux de construction.
    </p>

    <div class="price">
      6 000 FCFA / sac
    </div>

    <div class="seller">
      Vendeur : Bâtir Plus Construction

    <a class="btn btn-back" href="produits.html">

    </a>

</html>
