<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion entreprise - D-AB</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fa;
      color: #172033;
    }

    header {
      background: #172033;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #172033;
      text-decoration: none;
      font-weight: bold;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #ffb703;
      color: #172033;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      color: #d62828;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>D-AB</h1>
  <p>Connexion entreprise</p>
</header>

<main class="container">

  <a class="back" href="produits.html">← Retour aux produits</a>

  <div class="card">

    <h2 id="titre">Espace entreprise</h2>

    <p id="explication"></p>

    <form id="formConnexion">
      <label>Nom de l’entreprise</label>
<input id="nomEntreprise" type="text">
<label>E-mail de l’entreprise</label>
<input id="emailEntreprise" type="email" required>
      <label>Mot de passe</label>
      <input id="motDePasse" type="password" required>

      <button type="submit" id="boutonConnexion">
  Se connecter
</button>

<button type="button" id="boutonCreation">
  Créer un compte entreprise
</button>

    </form>

    <div id="message"></div>

  </div>

</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = 'https://mkfjrwfnvroeonqmgsjw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Ad4HQyLSi-83bvPRMu8f4Q_yCTor5JT';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
  document.getElementById('formConnexion')
  .addEventListener('submit', async function(event) {

    event.preventDefault();

    const email =
      document.getElementById('emailEntreprise').value.trim();

    const motDePasse =
      document.getElementById('motDePasse').value;

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: motDePasse
      });

    if (error) {
      document.getElementById('message').textContent =
        'E-mail ou mot de passe incorrect.';
      return;
    }

    localStorage.setItem('modeEntreprise', 'true');

    location.href = 'ajouter-produit.html';
  });
  

document.getElementById('boutonCreation')
  .addEventListener('click', async function() {

    const nom =
      document.getElementById('nomEntreprise').value.trim();

    const email =
      document.getElementById('emailEntreprise').value.trim();

    const motDePasse =
      document.getElementById('motDePasse').value;

    if (!nom) {
      document.getElementById('message').textContent =
        'Entrez le nom de votre entreprise.';
      return;
    }

    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: motDePasse,
        options: {
          data: {
            nom_entreprise: nom
          }
        }
      });

    if (error) {
      document.getElementById('message').textContent =
        error.message;
      return;
    }

    if (data.session) {
      localStorage.setItem('modeEntreprise', 'true');
      location.href = 'ajouter-produit.html';
    } else {
      document.getElementById('message').textContent =
        'Compte créé. Vérifiez votre e-mail pour confirmer votre inscription.';
    }
  });
</script>

</body>
</html>
