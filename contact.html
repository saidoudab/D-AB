<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - D-AB</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #172033;
    }

    header {
      background: #172033;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 20px;
    }

    .container {
      padding: 35px;
      max-width: 700px;
      margin: auto;
    }

    .back {
      display: block;
      color: #172033;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 35px;
    }

    .title {
      font-size: 36px;
      margin-bottom: 30px;
    }

    .contact-card {
      background: white;
      padding: 30px;
      border-radius: 22px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    }

    .contact-card h2 {
      margin-bottom: 12px;
      font-size: 24px;
    }

    .contact-card p {
      color: #747b87;
      font-size: 18px;
      line-height: 1.5;
    }

    .contact-card a {
      color: #172033;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #747b87;
    }
  </style>
</head>

<body>

  <header>
    <h1>D-AB</h1>
    <p>Contact</p>
  </header>

  <main class="container">

    <a class="back" href="index.html">← Retour à l'accueil</a>

    <h2 class="title">📞 Contact</h2>

    <div class="contact-card" onclick="location.href='tel:+22606168510'" style="cursor:pointer;">
      <h2>📱 Téléphone</h2>
      <p>Contactez directement D-AB par téléphone.</p>
    </div>

    <div class="contact-card" onclick="location.href='https://wa.me/22606168510'" style="cursor:pointer;">
      <h2>💬 WhatsApp</h2>
      <p>Discutez rapidement avec D-AB via WhatsApp.</p>
    </div>

    <div class="contact-card">
      <h2>✉️ E-mail</h2>
      <p>Envoyez un message à D-AB par e-mail.</p>
    </div>

  </main>

  <footer>
    © 2026 D-AB – Tous droits réservés
  </footer>

</body>
</html>
