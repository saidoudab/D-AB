<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menuiserie - D-AB</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f4f6fa;
  color: #14213d;
}

header {
  background: #082b5c;
  color: white;
  padding: 28px 20px;
  text-align: center;
}

header h1 {
  font-size: 30px;
  margin-bottom: 8px;
}

main {
  padding: 30px 18px;
}

.back {
  display: block;
  color: #14213d;
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 25px;
}

.product {
  background: white;
  padding: 24px;
  border-radius: 18px;
  margin-bottom: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.06);
}

.product h2 {
  font-size: 25px;
  margin-bottom: 14px;
}

.product p {
  font-size: 18px;
  line-height: 1.5;
  margin-bottom: 18px;
}

.price {
  font-size: 27px;
  font-weight: bold;
}

button {
  margin-top: 18px;
  background: #ffb703;
  color: #14213d;
  border: none;
  padding: 14px 20px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>🪵 Menuiserie</h1>
  <p>D-AB Marketplace</p>
</header>

<main>

<a class="back" href="produits.html">← Retour aux produits</a>

<div class="product">
  <h2>Porte en bois</h2>
  <p>Porte solide et élégante pour maison ou bureau.</p>
  <div class="price">75 000 FCFA</div>
  <button onclick="ajouterPanier('Porte en bois', 75000)">+ Panier</button>
</div>

<div class="product">
  <h2>Fenêtre en bois</h2>
  <p>Fenêtre en bois robuste pour vos projets.</p>
  <div class="price">45 000 FCFA</div>
  <button onclick="ajouterPanier('Fenêtre en bois', 45000)">+ Panier</button>
</div>

</main>

<script>
function ajouterPanier(nom, prix) {
  let panier = JSON.parse(localStorage.getItem('panierDAB')) || [];

  let produitExistant = panier.find(function(produit) {
    return produit.nom === nom;
  });

  if (produitExistant) {
    produitExistant.quantite = (produitExistant.quantite || 1) + 1;
  } else {
    panier.push({
      nom: nom,
      prix: prix,
      quantite: 1
    });
  }

  localStorage.setItem('panierDAB', JSON.stringify(panier));
  alert(nom + " a été ajouté au panier");
}
</script>

</body>
</html>
