<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modifier un produit - D-AB</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fa;
      color: #172033;
    }

    header {
      background: #172033;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #172033;
      text-decoration: none;
      font-weight: bold;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>D-AB</h1>
  <p>Espace entreprise</p>
</header>

<main class="container">

  <a class="back" id="retourFiche" href="produits.html">← Retour au produit</a>

  <div class="card">

    <h2>Modifier le produit</h2>
    <p>Modifiez les informations souhaitées.</p>

    <form id="formProduit">

      <label>Nom du produit</label>
      <input id="nomProduit" type="text" required>

      <label>Description</label>
      <textarea id="descriptionProduit" required></textarea>

      <label>Prix</label>
      <input id="prixProduit" type="text" required>

      <label>Nom de l'entreprise</label>
      <input id="entrepriseProduit" type="text" required>

      <label>Téléphone / WhatsApp</label>
      <input id="telephoneProduit" type="tel" required>

      <label>Nouvelle photo (facultatif)</label>
      <input id="photoProduit" type="file" accept="image/*">

      <button type="submit">Enregistrer les modifications</button>

    </form>

  </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://mkfjrwfnvroeonqmgsjw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Ad4HQyLSi-83bvPRMu8f4Q_yCTor5JT';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
  const params = new URLSearchParams(window.location.search);
  const idProduit = params.get('id');
  let produit = null;

  const form = document.getElementById('formProduit');
  const retourFiche = document.getElementById('retourFiche');

  retourFiche.href = 'produit-detail.html?id=' + idProduit;
  (async function chargerProduit() {
  const { data, error } = await supabaseClient
    .from('produits')
    .select('id, entreprise_id, nom, description, prix, photo_url, entreprises(nom, telephone)')
    .eq('id', idProduit)
    .single();

  if (error || !data) {
    alert('Produit introuvable.');
    location.href = 'produits.html';
    return;
  }

  produit = data;

  document.getElementById('nomProduit').value = produit.nom || '';
  document.getElementById('descriptionProduit').value = produit.description || '';
  document.getElementById('prixProduit').value = produit.prix || '';
  document.getElementById('entrepriseProduit').value =
    (produit.entreprises && produit.entreprises.nom) || '';
  document.getElementById('telephoneProduit').value =
    (produit.entreprises && produit.entreprises.telephone) || '';
})();

  form.addEventListener('submit', async function(event) {
    event.preventDefault();

    const nom = document.getElementById('nomProduit').value;
    const description = document.getElementById('descriptionProduit').value;
    const prix = document.getElementById('prixProduit').value;
    const entreprise = document.getElementById('entrepriseProduit').value;
    const telephone = document.getElementById('telephoneProduit').value;
    const nouvellePhoto = document.getElementById('photoProduit').files[0];

    async function enregistrerModification(photoUrl) {
  const prixNombre =
    Number(String(prix).replace(/\D/g, ''));

  const { error: profilError } =
    await supabaseClient
      .from('entreprises')
      .update({
        nom: entreprise,
        telephone: telephone
      })
      .eq('id', produit.entreprise_id);

  if (profilError) {
    alert('Erreur entreprise : ' + profilError.message);
    return;
  }

  const { error } =
    await supabaseClient
      .from('produits')
      .update({
        nom: nom,
        description: description,
        prix: prixNombre,
        photo_url: photoUrl
      })
      .eq('id', idProduit);

  if (error) {
    alert('Erreur modification : ' + error.message);
    return;
  }

  alert('Produit modifié avec succès !');
  location.href = 'produit-detail.html?id=' + idProduit;
    }

    if (nouvellePhoto) {
  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();

  if (userError || !user) {
    alert('Votre connexion entreprise a expiré. Reconnectez-vous.');
    return;
  }

  const extension = nouvellePhoto.name.split('.').pop();
  const nomFichier =
    user.id + '/' + Date.now() + '.' + extension;

  const { error: uploadError } =
    await supabaseClient.storage
      .from('produits')
      .upload(nomFichier, nouvellePhoto);

  if (uploadError) {
    alert('Erreur photo : ' + uploadError.message);
    return;
  }

  const { data: urlData } =
    supabaseClient.storage
      .from('produits')
      .getPublicUrl(nomFichier);

  await enregistrerModification(urlData.publicUrl);

} else {
  await enregistrerModification(produit.photo_url || '');
    }
  });
</script>

</body>
</html>
