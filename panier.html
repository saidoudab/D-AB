<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon panier - D-AB</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fa;
    color: #14213d;
}

header {
    background: #06244d;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

.back {
    display: inline-block;
    margin-bottom: 20px;
    color: #14213d;
    text-decoration: none;
    font-weight: bold;
}

.panier-item {
    background: white;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.panier-item h3 {
    margin: 0 0 8px;
}

.prix {
    font-size: 20px;
    font-weight: bold;
}

.supprimer {
    border: none;
    background: #f1f1f1;
    color: #d32f2f;
    padding: 10px 14px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
}

.total {
    background: #06244d;
    color: white;
    padding: 20px;
    border-radius: 16px;
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
}

.commander {
    display: block;
    width: 100%;
    border: none;
    background: #ffb800;
    color: #14213d;
    padding: 16px;
    border-radius: 12px;
    margin-top: 15px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.vide {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 16px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>🛒 Mon panier</h1>
    <p>D-AB Marketplace</p>
</header>

<main class="container">

<a class="back" href="produits.html">← Continuer mes achats</a>

<div id="liste-panier"></div>

<div class="total">
    Total : <span id="total">0</span> FCFA
</div>
<div style="background:white;padding:16px;border-radius:16px;margin:20px 0;">
    <h3 style="margin-top:0;">Informations client</h3>

    <input
        id="nomClient"
        type="text"
        placeholder="Votre nom"
        style="width:100%;padding:12px;margin-bottom:10px;border:1px solid #ccc;border-radius:8px;"
    >

    <input
        id="telephoneClient"
        type="tel"
        placeholder="Votre téléphone"
        style="width:100%;padding:12px;margin-bottom:10px;border:1px solid #ccc;border-radius:8px;"
    >

    <input
        id="lieuClient"
        type="text"
        placeholder="Lieu de livraison"
        style="width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;"
    >
</div>
<button class="commander" onclick="commanderWhatsApp()">
  Commander sur WhatsApp
</button>
</main>

<script>
let panier = JSON.parse(localStorage.getItem("panierDAB")) || [];

function afficherPanier() {
    const liste = document.getElementById("liste-panier");
    const totalElement = document.getElementById("total");

    liste.innerHTML = "";

    if (panier.length === 0) {
        liste.innerHTML =
            '<div class="vide">Votre panier est vide 🛒</div>';
    }

    let total = 0;

    panier.forEach(function(produit, index) {
     if (!produit.quantite) {
    produit.quantite = 1;
     }   total += produit.prix * produit.quantite;

        liste.innerHTML += `
            <div class="panier-item">
                <h3>${produit.nom}</h3>
                <div class="prix">
                    ${produit.prix.toLocaleString("fr-FR")} FCFA
                </div> 
                <div style="display:flex;align-items:center;gap:10px;margin:12px 0;">
    <button onclick="changerQuantite(${index}, -1)">−</button>
    <strong>${produit.quantite}</strong>
    <button onclick="changerQuantite(${index}, 1)">+</button>
</div>
                <br>
                <button class="supprimer"
                    onclick="supprimerProduit(${index})">
                    Supprimer
                </button>
            </div>
        `;
    });

    totalElement.textContent = total.toLocaleString("fr-FR");
}

    function changerQuantite(index, changement) {
    panier[index].quantite += changement;

    if (panier[index].quantite < 1) {
        panier[index].quantite = 1;
    }

    localStorage.setItem("panierDAB", JSON.stringify(panier));
    afficherPanier();
}

function supprimerProduit(index) {
    panier.splice(index, 1);
    localStorage.setItem("panierDAB", JSON.stringify(panier));
    afficherPanier();
}


function commanderWhatsApp() {

    const nomClient =
        document.getElementById("nomClient").value.trim();

    const telephoneClient =
        document.getElementById("telephoneClient").value.trim();

    const lieuClient =
        document.getElementById("lieuClient").value.trim();

    if (!nomClient || !telephoneClient || !lieuClient) {
        alert(
            "Veuillez remplir votre nom, téléphone et lieu de livraison."
        );
        return;
    }

    if (panier.length === 0) {
        alert("Votre panier est vide.");
        return;
    }

    const vendeurs = {};
    let vendeurManquant = false;

    panier.forEach(function(produit) {

        let numero =
            String(produit.telephone || "")
                .replace(/\D/g, "")
                .replace(/^00/, "");

        if (numero.length === 8) {
            numero = "226" + numero;
        }

        if (!numero) {
            vendeurManquant = true;
            return;
        }

        const cle =
            produit.entreprise_id ||
            numero;

        if (!vendeurs[cle]) {
            vendeurs[cle] = {
                nom:
                    produit.entreprise ||
                    "Entreprise",
                numero: numero,
                produits: []
            };
        }

        vendeurs[cle].produits.push(
            produit
        );
    });

    if (vendeurManquant) {
        alert(
            "Un ancien produit du panier ne contient pas encore les informations du vendeur. Supprimez-le du panier puis ajoutez-le de nouveau."
        );
        return;
    }

    function creerLienWhatsApp(vendeur) {

        let message =
            "Bonjour, je souhaite commander sur D-AB.\n\n" +
            "Nom : " + nomClient + "\n" +
            "Téléphone : " + telephoneClient + "\n" +
            "Lieu de livraison : " + lieuClient + "\n\n" +
            "Commande :\n";

        let total = 0;

        vendeur.produits.forEach(
            function(produit) {

                const quantite =
                    produit.quantite || 1;

                const sousTotal =
                    produit.prix *
                    quantite;

                message +=
                    "- " +
                    produit.nom +
                    " x" +
                    quantite +
                    " : " +
                    sousTotal.toLocaleString(
                        "fr-FR"
                    ) +
                    " FCFA\n";

                total += sousTotal;
            }
        );

        message +=
            "\nTotal : " +
            total.toLocaleString(
                "fr-FR"
            ) +
            " FCFA";

        return (
            "https://wa.me/" +
            vendeur.numero +
            "?text=" +
            encodeURIComponent(message)
        );
    }

    const listeVendeurs =
        Object.values(vendeurs);

    if (listeVendeurs.length === 1) {

        window.location.href =
            creerLienWhatsApp(
                listeVendeurs[0]
            );

        return;
    }

    const ancien =
        document.getElementById(
            "choixVendeurs"
        );

    if (ancien) {
        ancien.remove();
    }

    const fond =
        document.createElement("div");

    fond.id = "choixVendeurs";

    fond.style.position = "fixed";
    fond.style.top = "0";
    fond.style.left = "0";
    fond.style.right = "0";
    fond.style.bottom = "0";
    fond.style.background = "rgba(0,0,0,0.65)";
fond.style.display = "flex";
fond.style.alignItems = "center";
fond.style.justifyContent = "center";
fond.style.padding = "20px";
fond.style.zIndex = "9999";

const boite = document.createElement("div");

boite.style.background = "white";
boite.style.width = "100%";
boite.style.maxWidth = "450px";
boite.style.padding = "22px";
boite.style.borderRadius = "16px";

const titre = document.createElement("h3");

titre.textContent =
    "Votre panier contient plusieurs vendeurs";

boite.appendChild(titre);

const texte = document.createElement("p");

texte.textContent =
    "Envoyez une commande séparée à chaque entreprise.";

boite.appendChild(texte);

listeVendeurs.forEach(function(vendeur) {

    const bouton =
        document.createElement("button");

    bouton.textContent =
        "Commander chez " + vendeur.nom;

    bouton.style.width = "100%";
    bouton.style.padding = "14px";
    bouton.style.marginTop = "12px";
    bouton.style.border = "none";
    bouton.style.borderRadius = "10px";
    bouton.style.background = "#ffb800";
    bouton.style.fontWeight = "bold";

    bouton.onclick = function() {
        window.open(
            creerLienWhatsApp(vendeur),
            "_blank"
        );
    };

    boite.appendChild(bouton);
});

const fermer =
    document.createElement("button");

fermer.textContent = "Fermer";
fermer.style.width = "100%";
fermer.style.padding = "12px";
fermer.style.marginTop = "15px";

fermer.onclick = function() {
    fond.remove();
};

boite.appendChild(fermer);
fond.appendChild(boite);
document.body.appendChild(fond);
}

afficherPanier();
</script>

</body>
</html>
