 <!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produits - D-AB</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #172033;
    }

    header {
      background: #172033;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    header h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    header p {
      color: #d9dde5;
      font-size: 18px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px 20px 50px;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: #172033;
      text-decoration: none;
      font-weight: bold;
      font-size: 17px;
    }

    .title {
      font-size: 30px;
      margin-bottom: 20px;
    }

    .product {
      background: white;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }

    .product h2 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .product p {
      color: #6b7280;
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .price {
      color: #16a34a;
      font-size: 22px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      color: #6b7280;
      padding: 25px;
    }
  </style>
</head>

<body>

  <header>
    <h1>D-AB</h1>
    <p>Nos produits</p>
  </header>

  <main class="container">

    <a class="back" href="index.html">← Retour à l'accueil</a>

    <h2 class="title">🛍️ Produits</h2>

    <div class="product">
      <h2>Produit 1</h2>
      <p>Description du produit.</p>
      <div class="price">Prix : à renseigner</div>
    </div>

    <div class="product">
      <h2>Produit 2</h2>
      <p>Description du produit.</p>
      <div class="price">Prix : à renseigner</div>
    </div>

    <div class="product">
      <h2>Produit 3</h2>
      <p>Description du produit.</p>
      <div class="price">Prix : à renseigner</div>
    </div>

  </main>

  <footer>
    © 2026 D-AB — Tous droits réservés
  </footer>

</body>
</html>
